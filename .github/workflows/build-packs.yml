# LibreRoute — construction et publication automatiques des packs de cartes.
#
# Tout se passe sur les machines gratuites de GitHub (dépôts publics) : aucun serveur
# personnel n'est sollicité. Les packs sont publiés dans les Releases de ce dépôt.
#
# Déclenchement :
#   - à la main : onglet « Actions » → « Construire les packs » → « Run workflow » ;
#   - automatiquement le 1er de chaque mois, pour tous les packs listés dans packs.json.
name: Construire les packs

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Nom du pack (lettres minuscules, chiffres, tirets). Vide = tous ceux de packs.json"
        required: false
        default: ""
      pbf_url:
        description: "Extrait OpenStreetMap en .osm.pbf (seulement si un nom de pack est donné)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write   # nécessaire pour créer les releases de ce dépôt, rien d'autre

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT_PACK: ${{ inputs.pack }}
          INPUT_URL: ${{ inputs.pbf_url }}
        run: |
          python3 - <<'PY'
          import json, os, re
          pack, url = os.environ.get("INPUT_PACK", "").strip(), os.environ.get("INPUT_URL", "").strip()
          if pack:
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,39}", pack):
                  raise SystemExit("nom de pack invalide")
              if not re.fullmatch(r"https://\S+\.osm\.pbf", url):
                  raise SystemExit("adresse .osm.pbf invalide")
              items = [{"pack": pack, "pbf_url": url}]
          else:
              items = json.load(open("packs.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": items}) + "\n")
          print(json.dumps(items, indent=1))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: 1        # un pack à la fois : la release « manifests » est partagée
      fail-fast: false
    env:
      LIBREROUTE_ROOT: ${{ github.workspace }}/../libreroute
      BUILD_THREADS: "4"
      PLANETILER_HEAP: "10g"
      PACK: ${{ matrix.pack }}
      PBF_URL: ${{ matrix.pbf_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Construire le pack
        run: ./pack-builder/build-pack.sh "$PACK" "$PBF_URL"

      - name: Publier sur les releases de ce dépôt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ./pack-builder/publish-github.py "$PACK" "$GITHUB_REPOSITORY"
